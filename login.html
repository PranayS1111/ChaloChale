<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChaloChale Travel App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- * Navbar Section  -->
    <section>

        <nav class="navbar navbar-dark bg-dark" style="z-index: 5;">
            <a href="" class="navbar-brand fw-bold mx-3">ChaloChale</a>
            <div class="navbar-nav d-flex flex-row">
                <a href="index.html" class="nav-link mx-3 active">Home</a>
                <a href="destination.html" class="nav-link mx-3">Destination</a>
                <a href="packages.html" class="nav-link mx-3">Packages</a>
                <a href="booking-form.html" class="nav-link mx-3">Booking</a>
                <a href="" class="nav-link mx-3">Contact</a>

                <a href="signup.html" class="btn btn-warning mx-2 px-3">Sign-up</a>
                <a href="login.html" class="btn btn-warning mx-2 px-3">Login</a>
            </div>
        </nav>





    </section>



    <!-- Signup Form -->
    <section class="py-5 bg-light flex-grow-1">
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-lg p-4 rounded-4">

                        <h3 class="text-center fw-bold mb-4">Sign In</h3>

                        <form>


                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" placeholder="Enter email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" placeholder="Enter password">
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                Sign In
                            </button>

                            <p class="text-center mt-3">
                                New User ?
                                <a href="signup.html">Create Account</a>
                            </p>

                        </form>

                    </div>
                </div>

            </div>
        </div>


    </section>










    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 ChaloChale Travel App | Designed with Bootstrap.</p>
    </footer>














    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
