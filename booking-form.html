<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChaloChale Travel App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <!-- * Navbar Section  -->
    <section>

        <nav class="navbar navbar-dark bg-dark" style="z-index: 5;">
            <a href="" class="navbar-brand fw-bold mx-3">ChaloChale</a>
            <div class="navbar-nav d-flex flex-row">
                <a href="index.html" class="nav-link mx-3">Home</a>
                <a href="destination.html" class="nav-link mx-3">Destination</a>
                <a href="packages.html" class="nav-link mx-3">Packages</a>
                <a href="booking-form.html" class="nav-link mx-3 active">Booking</a>
                <a href="" class="nav-link mx-3">Contact</a>

                <a href="signup.html" class="btn btn-warning mx-2 px-3">Sign-up</a>
                <a href="login.html" class="btn btn-warning mx-2 px-3">Login</a>
            </div>
        </nav>

    </section>











    <!-- * Box Model Starts ------------------------------------- -->
    <section class="py-5 bg-light">
        <div class="container">
            <div class="text-center mb-lg-5">

                <h1 class="fw-bold">Travel Booking Form</h1>
                <p class="lead">Fill the form and submit your travel request.</p>
            </div>

            <div class="row justify-content-center">

                <div class="col-12">
                    <div class="shadow-lg p-4 rounded-4">
                        <h3 class="fw-bold mb-4 text-center">Book Your Trip</h3>
                        <hr class="mb-5 mt-3">
                        <form>
                            <div class="row mb-4">

                                <div class="col-md-6">
                                    <label class="form-label">Full Name :</label>
                                    <input type="text" class="form-control" placeholder="Enter your name.">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email :</label>
                                    <input type="text" class="form-control" placeholder="Enter your mail.">
                                </div>

                            </div>

                            <div class="row mb-4">
                                <div class="col-6">
                                    <label class="form-label">Select Destination :</label>
                                    <select class="form-select">
                                        <option>Goa</option>
                                        <option>Manali</option>
                                        <option>Kerala</option>
                                        <option>Jaipur</option>
                                        <option>Agra</option>
                                    </select>
                                </div>

                                <div class="col-6">
                                    <label class="form-label">Date :</label>
                                    <input type="date" class="form-control">
                                </div>

                            </div>

                            <div class="col-12 mb-4">
                                <label class="form-label">Number of People :</label>
                                <input type="number" class="form-control" placeholder="Enter number of People.">
                            </div>

                            <div class="col-12 mb-4">
                                <label class="form-label">Message / Requirement :</label>
                                <textarea class="form-control" rows="4" placeholder="Enter any travel requirement."></textarea>
                            </div>

                            <hr class="mb-4">
                            <button type="submit" class="btn btn-success w-100">
                                Submit Booking Request
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- * Box Model Ends -------------------------------  -->






    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 ChaloChale Travel App | Designed with Bootstrap.</p>
    </footer>














    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
